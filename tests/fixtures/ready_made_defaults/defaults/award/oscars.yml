#####
#  Academy Awards (Oscars)  #
#  https://kometa.wiki/en/latest/defaults/award/oscars  #
#####

collections:
  Oscars Best Picture:
    template:
      - name: shared
        allowed_libraries: movie
  Award Separator:
    template:
      - name: separator

dynamic_collections:
  Oscars Winners:
    type: imdb_awards
    data:
      event_id: ev0000003
      starting: latest-2
      ending: latest
    title_format: Oscars Winners <<key_name>>
