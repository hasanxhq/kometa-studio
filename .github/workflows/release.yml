# Build a wheel (frontend baked in) and attach it to a published GitHub release.
# Also runnable by hand for an existing tag via workflow_dispatch.
name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to rebuild (e.g. v0.0.1-alpha.1)"
        required: true
        type: string

# Least privilege by default; only the upload job gets contents: write.
permissions: {}

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.tag }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: |
          python -m pip install build
          python -m build

      - name: Check wheel has the frontend and matches the tag
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          python - <<'PY'
          import os
          import zipfile
          from email.parser import Parser
          from pathlib import Path

          from packaging.version import Version

          tag = os.environ["TAG"]
          if not tag.startswith("v"):
              raise SystemExit(f"tag must start with v, got {tag!r}")
          expected = Version(tag[1:])

          wheels = sorted(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected one wheel in dist/, found {wheels}")
          wheel = wheels[0]

          with zipfile.ZipFile(wheel) as zf:
              names = zf.namelist()
              if "starr_studio/static/index.html" not in names:
                  raise SystemExit(
                      f"{wheel.name} is missing starr_studio/static/index.html"
                  )
              meta_name = next(n for n in names if n.endswith(".dist-info/METADATA"))
              meta = Parser().parsestr(zf.read(meta_name).decode())
              got = Version(meta["Version"])

          if got != expected:
              raise SystemExit(
                  f"wheel version {got!s} != tag {tag!r} (PEP 440 expected {expected!s})"
              )
          print(f"ok: {wheel.name} version={got} has static/index.html")
          PY

      - name: Upload wheel and sdist to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.meta.outputs.tag }}" dist/*.whl dist/*.tar.gz --clobber
