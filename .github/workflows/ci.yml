name: ci

on:
  push:
    branches: [dev, "release/**", "hotfix/**"]
  pull_request:
    branches: [main, dev, "release/**", "hotfix/**"]

# A new push to a PR cancels that PR's older run. Pushes to dev, release/** and
# hotfix/** each get their own group (the commit's SHA), so they always finish:
# checkpoint tags need a green run for that exact commit.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Branch protection requires this job by name, so keep it called "test".
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Backend tests
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Frontend tests
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm test
