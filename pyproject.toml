[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "starr-studio"
dynamic = ["version"]
description = "Unofficial arr-style web GUI for Kometa"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "httpx[socks]>=0.28",  # socks: a SOCKS5 proxy for Studio's own calls (Settings → Network)
    "PySocks>=1.7",  # copied for Kometa's Python when the proxy is SOCKS5 (network.py)
    "ruamel.yaml>=0.18",
    "cryptography>=43",
    "tzdata>=2024.1",  # timezone data for zoneinfo where the system has none
    "pillow>=11",  # the Defaults gallery's covers (default_covers.py)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[project.scripts]
starr-studio = "starr_studio.cli:main"

# The version lives only in VERSION (see AGENTS.md).
[tool.hatch.version]
path = "VERSION"
pattern = "^(?P<version>\\S+)\\s*$"

[tool.hatch.build.targets.wheel]
packages = ["starr_studio"]
# The built frontend is git-ignored, so list it explicitly or Hatch leaves it out.
artifacts = ["starr_studio/static/**"]

# Same files for the sdist: `python -m build` builds the wheel from the sdist,
# so without this the wheel loses the frontend even when artifacts are set above.
[tool.hatch.build.targets.sdist]
artifacts = ["starr_studio/static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
