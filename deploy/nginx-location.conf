# Starr Studio reverse proxy location block for nginx.
# Include inside an existing server { ... } block or in ~/.apps/nginx/proxy.d/ on Ultra.cc.

location /kometa/ {
    proxy_pass http://127.0.0.1:8484;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # Disable buffering for live Server-Sent Events (SSE) logs
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_read_timeout 1h;

    # Custom poster uploads (up to 10 MB in Studio)
    client_max_body_size 12m;
}
